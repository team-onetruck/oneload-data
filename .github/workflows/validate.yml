name: Validate

on:
  push:
  pull_request:

# Validation only. Deploys run from the private oneload-backend repo; a public repo must never use the
# self-hosted runner, because a fork's pull request could run code on the server.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "jsonschema>=4.23,<5"
      - run: python tools/validate.py
